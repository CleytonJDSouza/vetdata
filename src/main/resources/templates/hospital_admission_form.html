        label.error {

            border-radius: 5px;
            display: block;
            margin-top: 5px;
        }

        /* Adiciona uma borda vermelha nos inputs com erro */

            background-color: #fff0f0;

                    <i class="fa-fw fa fa-pencil-square-o"></i>
                    Forms
                    <span>>
				Form Internações
			</span>
                </h1>
            </div>
        </div>

        <!-- widget grid -->
        <section id="widget-grid" class="">
            <!-- START ROW -->
            <div class="row">
                <!-- NEW COL START -->
                <article class="col-sm-12 col-md-12 col-lg-12">
                    <!-- Widget ID (each widget will need unique ID)-->
                    <div class="jarviswidget" id="wid-id-1" data-widget-editbutton="false" data-widget-custombutton="false">
                        <header>
                            <span class="widget-icon"> <i class="fa fa-edit"></i> </span>
                            <h2>Cadastro de Internações </h2>
                        </header>

                        <!-- widget div-->
                        <div>
                            <!-- widget edit box -->
                            <div class="jarviswidget-editbox">
                                <!-- This area used as dropdown edit box -->
                            </div>
                            <!-- end widget edit box -->

                            <!-- widget content -->
                            <div class="widget-body no-padding">
                                <form id="health-record-form" class="smart-form" novalidate="novalidate">
                                    <header>
                                        Informações Gerais
                                    </header>
                                    <fieldset>
                                        <div class="row">
                                            <section class="col col-6">
                                                <label class="input"> <i class="icon-append fa fa-calendar"></i>
                                                    <input type="text" name="date" id="date" placeholder="Data da Internação">
                                                </label>
                                            </section>
                                        </div>
                                        <div class="row">
                                            <section class="col col-6">
                                                <label class="input"> <i class="icon-append fa fa-calendar"></i>
                                                    <input type="text" name="dateMedicalDischarge" id="dateMedicalDischarge" placeholder="Data da Alta Médica">
                                                </label>
                                            </section>
                                            <section class="col col-6">
                                                <label class="input"> <i class="icon-append fa fa-calendar"></i>
                                                    <input type="text" name="dateReturns" id="dateReturns" placeholder="Data do Retorno">
                                                </label>
                                            </section>
                                        </div>
                                    </fieldset>

                                    <header>
                                        Características
                                    </header>
                                    <fieldset>
                                        <div class="row">
                                            <section class="col col-6">
                                                <select multiple name="diagnosticIds" id="diagnosticIds" class="select2" style="width: 100%;">
                                                </select>
                                            </section>
                                            <section class="col col-6">
                                                <select multiple name="postOperativeIds" id="postOperativeIds" class="select2" style="width: 100%;">
                                                </select>
                                            </section>
                                        </div>
                                        <div class="row">
                                            <section class="col col-6">
                                                <label class="select">
                                                    <select name="reasonHospitalization" id="reasonHospitalization">
                                                        <option value="0" selected="" disabled="">Motivo da Internação</option>
                                                        <option value="Pós Operatório">Pós Operatório</option>
                                                        <option value="Neurologia">Neurologia</option>
                                                    </select> <i></i> </label>
                                            </section>
                                            <section class="col col-6">
                                                <label class="select">
                                                    <select name="medicalEvolution" id="medicalEvolution">
                                                        <option value="0" selected="" disabled="">Evolução Médica</option>
                                                        <option value="Pós Operatório">Pós Operatório</option>
                                                        <option value="Neurologia">Neurologia</option>
                                                    </select> <i></i> </label>
                                            </section>
                                        </div>
                                    </fieldset>
                                    <footer>
                                        <button type="btn" class="btn btn-primary">
                                            Cadastrar
                                        </button>
                                        <button type="button" id="reset-form" class="btn btn-default">Limpar Form</button>

<script type="text/javascript">
    $(document).ready(function() {
        pageSetUp();


        $('#date').datepicker({
            dateFormat : 'dd.mm.yy',
            prevText : '<i class="fa fa-chevron-left"></i>',
            nextText : '<i class="fa fa-chevron-right"></i>',
            onSelect : function(selectedDate) {
                $('#finishdate').datepicker('option', 'minDate', selectedDate);
            }
        });

        $('#dateMedicalDischarge').datepicker({
            dateFormat : 'dd.mm.yy',
            prevText : '<i class="fa fa-chevron-left"></i>',
            nextText : '<i class="fa fa-chevron-right"></i>',
            onSelect : function(selectedDate) {
                $('#finishdate').datepicker('option', 'minDate', selectedDate);
            }
        });

        $('#dateReturns').datepicker({
            dateFormat : 'dd.mm.yy',
            prevText : '<i class="fa fa-chevron-left"></i>',
            nextText : '<i class="fa fa-chevron-right"></i>',
            onSelect : function(selectedDate) {
                $('#finishdate').datepicker('option', 'minDate', selectedDate);
            }
        });

        $('#diagnosticIds').select2({
            placeholder: 'Qual o diagnóstico do câo ?',
            minimumInputLength: 1,
            language: {
                inputTooShort: function () {
                    return 'Digite 1 ou mais caracteres';
                },
                searching: function () {
                    return 'Buscando...';
                },
                noResults: function () {
                    return 'Nenhum resultado encontrado';
                },
                loadingMore: function () {
                    return 'Carregando mais resultados...';
                }
            },
            ajax: {
                url: '/breeds',
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {
                        page: params.page || 0, // página atual
                        qtdRecordsPage: 10,
                        searchByTerm: params.term || '', // termo de busca
                        sortBy: 'name' // ou outro campo se quiser
                    };
                },
                processResults: function (data, params) {
                    const currentPage = data.page;
                    const totalItems = data.total;
                    const pageSize = data.qtdRecordsPage;

                    // Atualiza página para Select2
                    params.page = params.page || 0;

                    return {
                        results: data.data.map(function (breed) {
                            return {
                                id: breed.id,
                                text: breed.name
                            };
                        }),
                        pagination: {
                            more: (currentPage + 1) * pageSize < totalItems
                        }
                    };
                },
                cache: true
            }
        });

        $("#codPatient").focus();

        $("#reset-form").click(function() {
            $("#health-record-form").trigger("reset");
            $("#health-record-form").validate().resetForm();
            $("#codPatient").focus();
        });

        $('#health-record-form').validate({
            // Rules for form validation
            rules : {
                codPatient : {
                    required : true
                },
                patient : {
                    required : true
                },
                age : {
                    required : true,
                    digits : true
                },
                tutor : {
                    required : true
                },
                breedSelect : {
                    required : true
                },
                color : {
                    required : true
                },
                weight : {
                    required : true,
                    digits : true
                },
                gender : {
                    required : true
                },
                size : {
                    required : true,
                },
                death : {
                    required : true,
                },
                euthanasia : {
                    required : true,
                }
            },
            // Messages for form validation
            messages : {
                codPatient : {
                    required : 'Código do paciente é obrigatório !'
                },
                patient : {
                    required : 'Nome do paciente é obrigatório !'
                },
                age : {
                    required : 'A idade do animal é obrigatória !',
                    digits : 'Esse campo só aceita números !'
                },
                tutor : {
                    required : 'A nome do tutor é obrigatório !'
                },
                breedSelect : {
                    required : 'A raça do câo é obrigatória !'
                },
                color : {
                    required : 'A cor do animal é obrigatória !'
                },
                weight : {
                    required : 'O peso do animal é obrigatório !',
                    digits : 'Esse campo só aceita números !'
                },
                gender : {
                    required : 'O genêro do animal é obrigatório !'
                },
                size : {
                    required : 'O porte do animal é obrigatório !'
                },
                death : {
                    required : 'O campo morte do animal é obrigatório !'
                },
                euthanasia : {
                    required : 'O campo eutanasia é obrigatório !'
                }
            },
            submitHandler : function(form) {
                var formData = {
                    codPatient: $("#codPatient").val(),
                    patient: $("#patient").val(),
                    age: $("#age").val(),
                    tutor: $("#tutor").val(),
                    color: $("#color").val(),
                    breedId: $("#breedSelect").val(),
                    weight: $("#weight").val(),
                    gender: $("#gender").val(),
                    size: $("#size").val(),
                    death: $("#death").val(),
                    euthanasia: $("#euthanasia").val()
                };
                $.ajax({
                    type: "POST",
                    url: "/health-records",
                    contentType: "application/json",
                    data: JSON.stringify(formData),
                    success: function (response) {
                        $.smallBox({
                            title : "Prontuário cadastrado com sucesso !",
                            color : "#739E73",
                            iconSmall : "fa fa-save",
                            timeout : 3000
                        },function() {
                            window.location.href = "/health-records-pages/list"
                        });
                    },
                    error: function (xhr) {
                        if (xhr.status === 400) {
                            var errors = JSON.parse(xhr.responseText);
                            for (var field in errors) {
                                $("#health-record-form").validate().showErrors({
                                    [field]: errors[field]
                                });
                            }
                            $.bigBox({
                                title : "Erro ao tentar atualizar um prontuário !",
                                content : "Existem erros de validação no seu formulário. Verifique se logo abaixo aos campos não aparecem mensagens de erros.",
                                color : "#C46A69",
                                //timeout: 6000,
                                icon : "fa fa-warning shake animated",
                                timeout : 10000
                            });

                            e.preventDefault();
                        }
                    }
                });
            },

            // Do not change code below
            errorPlacement : function(error, element) {
                error.insertAfter(element.parent());
            }
        });
    })
</script>
