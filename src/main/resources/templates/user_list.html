<script type="text/javascript">
    // DO NOT REMOVE : GLOBAL FUNCTIONS!

    $(document).ready(function() {

        pageSetUp();

        $('[data-toggle="passwordTooltip"]').tooltip();

        $('#usersModal').on('shown.bs.modal', function () {
            $('#name').trigger('focus');
        });

        /* BASIC ;*/
        var responsiveHelper_dt_basic = undefined;
        var responsiveHelper_datatable_fixed_column = undefined;
        var responsiveHelper_datatable_col_reorder = undefined;
        var responsiveHelper_datatable_tabletools = undefined;

        var breakpointDefinition = {
            tablet : 1024,
            phone : 480
        };

        let table = $('#dt_basic').DataTable({
            "sDom": "<'dt-toolbar'<'col-xs-12 col-sm-6'f><'col-sm-6 col-xs-12 hidden-xs'l>r>"+
                "t"+
                "<'dt-toolbar-footer'<'col-sm-6 col-xs-12 hidden-xs'i><'col-xs-12 col-sm-6'p>>",
            "autoWidth" : true,
            "oLanguage": {
                "sProcessing":   "Processando...",
                "sLengthMenu":   "Exibir _MENU_ registros",
                "sZeroRecords":  "Nenhum registro encontrado",
                "sInfo":         "Exibindo de _START_ até _END_ de _TOTAL_ registros",
                "sInfoEmpty":    "Exibindo de 0 até 0 de 0 registros",
                "sInfoFiltered": "(filtrado de _MAX_ registros no total)",
                "sSearch": '<span class="input-group-addon"><i class="glyphicon glyphicon-search"></i></span>',
                "oPaginate": {
                    "sFirst":    "Primeiro",
                    "sPrevious": "Anterior",
                    "sNext":     "Próximo",
                    "sLast":     "Último"
                }
            },
            "ajax": function(data, callback, settings) {
                $.ajax({
                    url: "/users",
                    type: "GET",
                    success: function(response) {
                        callback({
                            data: response
                        });
                    }
                });
            },
            "columns": [
                { "data": "name", "title": "Nome" },
                { "data": "email", "title": "Email" },
                { "data": "createdDate", "title": "Data de Criação" },
                { "data": "passwordLastUpdatedDate", "title": "Ultima atualização de senha" },
                {
                    "data": "id",
                    "render": function(data) {
                        return `<a href="#" class="link-delete" data-id="${data}">
                            <i class="fa fa-trash"></i>
                        </a>`;
                    }
                }
            ]
        });
        /* END BASIC */

        $('#btnCadastrarUsuario').on('click', function () {
            if (isValid()) {
                const nome = $('#name').val();
                const email = $('#email').val();
                const senha = $('#password').val();
                //const nivelAcesso = $('#nivelAcesso').val();

                $.ajax({
                    url: '/users',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        name: nome,
                        email: email,
                        password: senha
                    }),
                    success: function (response) {
                        $.smallBox({
                            title : "Usuário cadastrado com sucesso !",
                            color : "#739E73",
                            iconSmall : "fa fa-save",
                            timeout : 9000
                        });
                         $('#usersModal').modal('hide');
                         table.ajax.reload();
                         $('#email').val('');
                         $('#password').val('');
                         $('#name').val('').focus();
                    },
                    error: function (xhr, status, error) {
                        let conteudoErro = "Erro desconhecido.";

                        try {
                            const resposta = JSON.parse(xhr.responseText);

                            if (typeof resposta === 'object') {
                                conteudoErro = Object.values(resposta).join("<br>");
                            } else {
                                conteudoErro = resposta;
                            }

                        } catch (e) {
                            conteudoErro = xhr.responseText || "Erro inesperado no servidor.";
                        }

                        $.bigBox({
                            title : "Erro ao cadastrar usuário !",
                            content : conteudoErro,
                            color : "#C46A69",
                            //timeout: 6000,
                            icon : "fa fa-warning shake animated",
                        });
                    }
                });
            }
        });



        $('#dt_basic tbody').on('click', '.link-delete', function (e) {
            e.preventDefault();
            let id = $(this).data('id');
            $.SmartMessageBox({
                title : "<i class=\"fa fa-trash-o txt-color-red\"></i> <span class=\"txt-color-red\"><strong>Exlusão de um Usuário !</strong></span>",
                content : "Deseja excluir este registro ?",
                buttons : '[Não][Sim]'
            }, function(ButtonPressed) {
                if (ButtonPressed === "Sim") {
                    $.ajax({
                        url: "/users/" + id,
                        type: "DELETE",
                        success: function (response) {
                            $.smallBox({
                                title : "Usuário excluido com sucesso !",
                                color : "#739E73",
                                iconSmall : "fa  fa-trash-o",
                                timeout : 9000
                            });
                            table.ajax.reload();
                        },
                        error: function (xhr, status, error) {
                            $.bigBox({
                                title : "Erro ao tentar excluir um usuário !",
                                content : "Erro ao tentar excluir: " + xhr.responseText,
                                color : "#C46A69",
                                icon : "fa fa-warning shake animated",
                                timeout : 10000
                            });
                        }
                    });
                }
            });
            e.preventDefault();
        });
    })

    function isValid() {
        let isValid = true;
        let mensagensErro = [];

        const nome = $("#name").val().trim();
        const email = $("#email").val().trim();
        const senha = $("#password").val();

        if (nome === "") {
            isValid = false;
            mensagensErro.push("O nome é obrigatório.");
        }

        const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === "") {
            isValid = false;
            mensagensErro.push("O email é obrigatório.");
        } else if (!regexEmail.test(email)) {
            isValid = false;
            mensagensErro.push("O email informado é inválido.");
        }

        const regexSenha = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[%&*@]).{5,}$/;
        if (senha === "") {
            isValid = false;
            mensagensErro.push("A senha é obrigatória.");
        } else if (!regexSenha.test(senha)) {
            isValid = false;
            mensagensErro.push("A senha deve conter pelo menos uma letra maiúscula, um número, um caractere especial (%&*@) e ter no mínimo de 5 caracteres.");
        }

        if (!isValid) {
            $.bigBox({
                title : "Erro ao cadastrar usuário !",
                content : mensagensErro.join("\n"),
                color : "#C46A69",
                //timeout: 6000,
                icon : "fa fa-warning shake animated",
            });
        }

        return isValid;
    }

</script>
