<script type="text/javascript">

    // DO NOT REMOVE : GLOBAL FUNCTIONS!

    $(document).ready(function() {

        pageSetUp();

        /* // DOM Position key index //

			l - Length changing (dropdown)
			f - Filtering input (search)
			t - The Table! (datatable)
			i - Information (records)
			p - Pagination (paging)
			r - pRocessing
			< and > - div elements
			<"#id" and > - div with an id
			<"class" and > - div with a class
			<"#id.class" and > - div with an id and class

			Also see: http://legacy.datatables.net/usage/features
			*/

        /* BASIC ;*/
        var responsiveHelper_dt_basic = undefined;
        var responsiveHelper_datatable_fixed_column = undefined;
        var responsiveHelper_datatable_col_reorder = undefined;
        var responsiveHelper_datatable_tabletools = undefined;

        var breakpointDefinition = {
            tablet : 1024,
            phone : 480
        };

        let table = $('#dt_basic').DataTable({
            "sDom": "<'dt-toolbar'<'col-xs-12 col-sm-6'f><'col-sm-6 col-xs-12 hidden-xs'l>r>"+
                "t"+
                "<'dt-toolbar-footer'<'col-sm-6 col-xs-12 hidden-xs'i><'col-xs-12 col-sm-6'p>>",
            "autoWidth" : true,
            "oLanguage": {
                "sProcessing":   "Processando...",
                "sLengthMenu":   "Exibir _MENU_ registros",
                "sZeroRecords":  "Nenhum registro encontrado",
                "sInfo":         "Exibindo de _START_ até _END_ de _TOTAL_ registros",
                "sInfoEmpty":    "Exibindo de 0 até 0 de 0 registros",
                "sInfoFiltered": "(filtrado de _MAX_ registros no total)",
                "sSearch": '<span class="input-group-addon"><i class="glyphicon glyphicon-search"></i></span>',
                "oPaginate": {
                    "sFirst":    "Primeiro",
                    "sPrevious": "Anterior",
                    "sNext":     "Próximo",
                    "sLast":     "Último"
                }
            },
            "serverSide": true,  // Definir para server-side pagination
            "ajax": function(data, callback, settings) {
                // Montando os parâmetros para a API
                const page = settings._iDisplayStart / settings._iDisplayLength; // Página atual
                const qtdRecordsPage = settings._iDisplayLength; // Quantidade de registros por página
                const sortBy = settings.aaSorting[0][0] == 0 ? 'name' : 'id'; // Defina o campo de ordenação, exemplo "name"
                const searchTerm = data.search.value;

                $.ajax({
                    url: "/breeds",
                    type: "GET",
                    data: {
                        page: page,
                        qtdRecordsPage: qtdRecordsPage,
                        sortBy: sortBy,
                        searchByTerm: searchTerm
                    },
                    success: function(response) {
                        // Passando os dados e informações de paginação para o DataTable
                        callback({
                            draw: settings.iDraw,
                            recordsTotal: response.total,
                            recordsFiltered: response.total,
                            data: response.data
                        });
                    }
                });
            },
            "columns": [
                { "data": "name", "title": "Nome" },
                { "data": "description", "title": "Descrição" },
                { "data": "lifeExpectancyMin", "title": "Expectativa Mínima" },
                { "data": "lifeExpectancyMax", "title": "Expectativa Máxima" },
                { "data": "maleWeightMin", "title": "Peso Mín. Macho" },
                { "data": "maleWeightMax", "title": "Peso Máx. Macho" },
                { "data": "femaleWeightMin", "title": "Peso Mín. Fêmea" },
                { "data": "femaleWeightMax", "title": "Peso Máx. Fêmea" },
                { "data": "hypoallergenic", "title": "Hipoalergênico", "render": function(data) {
                        return data ? 'Sim' : 'Não'; // Converte true/false para Sim/Não
                    }},
                {
                    "data": "id",
                    "render": function(data) {
                        return `<a href="/breeds-pages/form_update/${data}" class="link-edit">
                            <i class="fa fa-edit"></i>
                        </a>`;
                    }
                },
                {
                    "data": "id",
                    "render": function(data) {
                        return `<a href="#" class="link-delete" data-id="${data}">
                            <i class="fa fa-trash"></i>
                        </a>`;
                    }
                }
            ]
        });
        /* END BASIC */

        $('#dt_basic tbody').on('click', '.link-delete', function (e) {
            e.preventDefault();
            let id = $(this).data('id');
            $.SmartMessageBox({
                title : "<i class=\"fa fa-trash-o txt-color-red\"></i> <span class=\"txt-color-red\"><strong>Exlusão de uma Raça !</strong></span>",
                content : "Deseja excluir este registro ?",
                buttons : '[Não][Sim]'
            }, function(ButtonPressed) {
                if (ButtonPressed === "Sim") {
                    $.ajax({
                        url: "/breeds/" + id,
                        type: "DELETE",
                        success: function (response) {
                            $.smallBox({
                                title : "Raça excluida com sucesso !",
                                color : "#739E73",
                                iconSmall : "fa  fa-trash-o",
                                timeout : 2000
                            });
                            table.ajax.reload();
                        },
                        error: function (xhr, status, error) {
                            $.bigBox({
                                title : "Erro ao tentar excluir uma raça !",
                                content : "Erro ao tentar excluir: " + xhr.responseText,
                                color : "#C46A69",
                                icon : "fa fa-warning shake animated",
                                timeout : 10000
                            });
                        }
                    });
                }
            });
            e.preventDefault();
        });

        $('#import-breeds').on('click', function (e) {
            e.preventDefault();
            $.SmartMessageBox({
                title : "<i class=\"fa  fa-download txt-color-blue\"></i> <span class=\"txt-color-blue\"><strong>Importação de Novas Raças !</strong></span>",
                content : "Deseja importar novas raças ?",
                buttons : '[Não][Sim]'
            }, function(ButtonPressed) {
                if (ButtonPressed === "Sim") {
                    $('#loading').show();
                    $.ajax({
                        url: "/breeds/import",
                        type: "PUT",
                        success: function (response) {
                            $('#loading').hide();
                            window.location.reload();
                        },
                        error: function (xhr, status, error) {
                            $('#loading').hide();
                            $.bigBox({
                                title : "Erro ao tentar importar novas raças !",
                                content : "Erro ao tentar importar: " + xhr.responseText,
                                color : "#C46A69",
                                icon : "fa fa-warning shake animated",
                                timeout : 10000
                            });
                        }
                    });
                }
            });
            e.preventDefault();
        });

        // $.get("/authentications/user-info", function(data) {
        //     $("#menuUsername").text(data.username); // Exibe no menu
        // });
        //
        // $("#logoutLink").on("click", function (e) {
        //     e.preventDefault();
        //

        //         url: "/authentications/logout",
        //         type: "POST",
        //         success: function () {
        //             window.location.href = "/login"
        //         },
        //         error: function () {
        //             alert("Erro ao tentar fazer logout.");
        //         }
        //     });
        // });
    })
