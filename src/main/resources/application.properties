spring.application.name=VetData

spring.datasource.url=jdbc:mysql://localhost:3307/vetdata
spring.datasource.username=vetuser
spring.datasource.password=vetpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

external.api.url=https://dogapi.dog/api/v2/breeds

server.servlet.session.timeout=1800